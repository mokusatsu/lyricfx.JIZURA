<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>風の先へ — 電球サインの比較</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10151e;color:#edf2f8;font:16px/1.6 system-ui,sans-serif}main{max-width:1600px;margin:auto;padding:24px}h1{font-size:clamp(24px,3vw,38px);margin:0 0 8px}p{color:#b9c6d8;margin:0 0 18px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0}button{font:inherit;border:1px solid #53667d;border-radius:8px;background:#233248;color:white;padding:8px 16px;cursor:pointer}button:hover{background:#314761}label{margin-left:8px;cursor:pointer}.videos{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0}figcaption{font-size:20px;margin-bottom:8px}.stage{position:relative;aspect-ratio:16/9;background:#151923;border-radius:0}video{display:block;width:100%;height:100%;object-fit:contain}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}.guide svg{display:block}h2{font-size:20px;margin-top:26px}ul{padding-left:22px;color:#cfdae8}#status{min-height:1.6em;font-size:14px}@media(max-width:850px){main{padding:16px}.videos{grid-template-columns:1fr}}
</style><main><h1>風の先へ — 電球サイン</h1><p>歌詞の並びと電球の動きを、前後の映像で見比べてください。</p><div class="toolbar"><button id="play" type="button">同時に再生</button><button id="pause" type="button">一時停止</button><button id="restart" type="button">先頭から</button><label><input id="guide" type="checkbox"> 円の位置を重ねる</label></div><div class="videos"><figure><figcaption>変更前</figcaption><div class="stage"><video id="before" muted playsinline loop preload="auto" poster="posters/before.png" src="videos/before.mp4" aria-label="変更前の電球サイン"></video><svg viewBox="0 0 960 540" aria-hidden="true"><circle cx="480" cy="226.8" r="108" fill="none" stroke="#ff84b7" stroke-width="2" stroke-dasharray="7 6"/></svg></div></figure><figure><figcaption>変更後</figcaption><div class="stage"><video id="after" muted playsinline loop preload="auto" poster="posters/after.png" src="videos/after.mp4" aria-label="変更後の電球サイン"></video><svg viewBox="0 0 960 540" aria-hidden="true"><circle cx="480" cy="226.8" r="108" fill="none" stroke="#ff84b7" stroke-width="2" stroke-dasharray="7 6"/></svg></div></figure></div><p id="status" aria-live="polite"></p><h2>見るところ</h2><ul><li>「風の」「先へ」の順に自然に読めるか</li><li>「No.01」が欠けずに見えるか</li><li>電球の密度と、追いかける光が自然か</li><li>出入りの勢いが、元の印象を保っているか</li></ul></main>
<script>(()=>{'use strict';const videos=[document.querySelector('#before'),document.querySelector('#after')],status=document.querySelector('#status');const ready=v=>v.readyState>=3?Promise.resolve():new Promise(ok=>v.addEventListener('canplay',ok,{once:true}));async function play(reset){try{await Promise.all(videos.map(ready));const time=reset?0:videos[0].currentTime;for(const v of videos)v.currentTime=time;await Promise.all(videos.map(v=>v.play()));status.textContent='';}catch{status.textContent='再生ボタンをもう一度押してください。';}}document.querySelector('#play').onclick=()=>play(false);document.querySelector('#pause').onclick=()=>videos.forEach(v=>v.pause());document.querySelector('#restart').onclick=()=>play(true);document.querySelector('#guide').onchange=e=>document.body.classList.toggle('guide',e.target.checked);})();</script></html>
