name: Desktop Build and Smoke Test

on:
  push:
    branches:
      - gemini
      - 'feature/**'
      - 'codex/**'
  pull_request:

jobs:
  build-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up FFmpeg
        run: choco install ffmpeg --no-progress

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r native/requirements-openvino.lock pyinstaller

      - name: Prepare AI models and verify runtime resources
        run: |
          python tools/build_desktop_runtime.py

      - name: Diagnose OpenVINO runtime environment
        run: |
          python -c "import sys, os; sys.path.insert(0, 'native'); import onnxruntime as ort; print('[DIAG] ORT version:', ort.__version__); print('[DIAG] Initial providers:', ort.get_available_providers()); import onnxruntime_ep_openvino as ep; lib = ep.get_library_path(); print('[DIAG] Plugin lib path:', lib, 'exists:', os.path.exists(lib)); from matting import _init_openvino_ep; print('[DIAG] _init_openvino_ep():', _init_openvino_ep()); print('[DIAG] After init providers:', ort.get_available_providers())"

      - name: Build and verify native worker binary (OpenVINO)
        run: |
          node desktop/scripts/build-worker.cjs openvino --install

      - name: Verify built worker reports OpenVINO backend
        run: |
          $probe = & desktop/resources/native/worker/worker.exe probe | ConvertFrom-Json
          if (-not ($probe.backends -contains "openvino")) {
            throw "Worker failed to report 'openvino' in backends: $($probe.backends)"
          }
          Write-Host "[CI] Verified worker probe backends: $($probe.backends -join ', ')"

      - name: Build Web and Electron Assets
        run: |
          python build.py
          python build.py --target electron --out desktop/web

      - name: Syntax Check on all JS files
        run: |
          node dev/check_syntax.cjs

      - name: Run Desktop & Native unit tests
        run: |
          python dev/desktop_build_test.py
          node dev/platform_web_test.cjs
          node dev/audio_lifecycle_test.cjs
          python native/tests/test_matte_format.py
          node dev/native_matte_compat_test.cjs
          python native/tests/test_matting_slots.py
          python native/tests/test_job_recovery.py
          node desktop/test/native_dialog.test.cjs
          node desktop/test/ipc_security.test.cjs
          node desktop/test/person_native_e2e.cjs
          node desktop/test/export_native_e2e.cjs
          node dev/portable_project_test.cjs

      - name: Package Desktop smoke (unpackaged)
        working-directory: desktop
        run: |
          npm install
          npm run package
