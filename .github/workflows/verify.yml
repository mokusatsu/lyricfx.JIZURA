name: Verify browser and MCP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies for native tests
        run: |
          python3 -m pip install -r native/requirements-cpu.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - name: Install locked MCP dependencies
        run: pnpm --dir mcp install --frozen-lockfile
      - name: Install Chromium with system dependencies
        working-directory: mcp
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Japanese and English editions
        run: |
          python3 build.py
          git diff --exit-code -- index.html en/index.html
      - name: Verify platform web regression and desktop build separation
        run: |
          node dev/check_syntax.cjs
          node dev/platform_web_test.cjs
          python3 dev/desktop_build_test.py
          python3 native/tests/test_matte_format.py
          node dev/native_matte_compat_test.cjs
          python3 native/tests/test_matting_slots.py
          python3 native/tests/test_job_recovery.py
          node desktop/test/native_dialog.test.cjs
          node desktop/test/ipc_security.test.cjs
          node desktop/test/person_native_e2e.cjs
          node desktop/test/export_native_e2e.cjs
          node dev/audio_lifecycle_test.cjs
          node dev/portable_project_test.cjs
      - name: Verify lyric parser and avoidance cache
        run: |
          node dev/lyric_test.js
          node dev/avoidance_unit_test.cjs
      - name: Verify both browser editions
        run: node mcp/site-smoke-test.mjs --local
      - name: Verify special cuts in Japanese and English
        run: |
          node mcp/special-cuts-test.mjs
          node mcp/special-cuts-test.mjs en
      - name: Verify interlude circle avoidance
        env:
          NODE_PATH: ${{ github.workspace }}/mcp/node_modules
        run: node dev/interlude_circle_test.cjs
      - name: Verify favorites and custom effects
        run: |
          node mcp/favorites-test.mjs
          node mcp/custom-effects-test.mjs
      - name: Verify avoidance timeline and person controls
        env:
          NODE_PATH: ${{ github.workspace }}/mcp/node_modules
        run: node dev/avoidance_timeline_person_test.cjs
      - name: Verify mask preview recovery and picker fallback
        env:
          NODE_PATH: ${{ github.workspace }}/mcp/node_modules
        run: |
          node dev/avoidance_editor_cursor_test.cjs
          node dev/avoidance_review_test.cjs
          node dev/avoidance_guide_toggle_test.cjs
          node dev/avoidance_cut_list_test.cjs
          node dev/avoidance_editor_layout_test.cjs
          node dev/avoidance_preview_recovery_test.cjs
          node dev/export_picker_recovery_test.cjs
      - name: Verify person cutout and export
        env:
          NODE_PATH: ${{ github.workspace }}/mcp/node_modules
        run: node dev/person_cutout_test.cjs
      - name: Verify person mask playback and guide
        env:
          NODE_PATH: ${{ github.workspace }}/mcp/node_modules
        run: node dev/person_mask_playback_test.cjs
      - name: Verify video background under lyric effects
        env:
          NODE_PATH: ${{ github.workspace }}/mcp/node_modules
        run: |
          node dev/media_video_edge_test.cjs
          node dev/mobile_video_seek_test.cjs
          node dev/video_omakase_play_test.cjs
      - name: Verify MCP integration and audio MP4 export
        working-directory: mcp
        run: pnpm test
