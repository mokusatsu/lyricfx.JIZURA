<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AVOID-003 実resolver確認</title>
<style>@font-face{font-family:Fixture;src:url(fixtures/font.otf)}body{font:16px Fixture,sans-serif;background:#17202b;color:#eee;margin:16px}a{color:#acf}button,select,input{font:inherit;max-width:100%}#capture{width:960px;max-width:100%;height:1360px;box-sizing:border-box;padding:16px;background:#17202b}#current{width:100%;height:430px;object-fit:contain;background:#101820}h2{font-size:20px;height:54px;margin:6px 0}#status{height:65px;margin:6px 0;overflow-wrap:anywhere}table{table-layout:fixed;width:100%;border-collapse:collapse;font-size:16px}td,th{border:1px solid #789;padding:5px;text-align:left;overflow-wrap:anywhere}#metrics{min-height:64px}pre{white-space:pre-wrap;overflow-wrap:anywhere}iframe{position:absolute;left:-20000px;width:1500px;height:1000px}#editor{display:flex;flex-wrap:wrap;gap:8px}#results{height:400px;overflow:visible}#limits{height:55px}@media(max-width:650px){#capture{height:auto;min-height:1360px}h2,#status,#metrics,#limits{height:auto;min-height:60px}#results{height:auto}#editor{display:block}#editor label{display:block;margin:10px 0}}
</style>
<h1>AVOID-003 時刻resolverの実測</h1><p>確認専用のプライベートセッションで開いてください。同一originの固定アプリを起動します。製品の新回避描画・新トラックUI・adapterは未接続です。図は制御データの結果であり、新しい歌詞軌道ではありません。</p>
<p><a href="index.html">比較</a> / <a href="fixtures/cases.json">同じ入力fixture</a> / <a href="fixtures/model-test.log">自動試験証拠</a></p>
<div id="editor"><label>サンプル <select id="case"></select></label><label>時刻 <input id="time" type="number" step="0.000001" value="1"></label><label>出力長 <input id="duration" type="number" step="1" min="0" value="10"></label><label>画面 <select id="aspect"><option>16:9</option><option>9:16</option><option>1:1</option><option>21:9</option><option>4:5</option><option>videoSize</option></select></label><button id="run">評価</button></div>
<div id="capture"><h2 id="label"></h2><p id="status"></p><canvas id="current" width="1920" height="1080"></canvas><p id="metrics"></p><div id="results"><table><thead><tr><th>選択時刻 / 区間</th><th>実装関数の返り値</th></tr></thead><tbody id="rows"></tbody></table></div><p id="limits">保存領域は短縮しても保持。製品3トラックへの追加・新回避描画は未実装。円は元ステージ短辺に対して等方。</p></div>
<details><summary>実測JSONと保存入力</summary><pre id="json"></pre></details><iframe id="app" title="固定ソースアプリ"></iframe>
<script>
(async()=>{const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),before=q.get('side')==='before';const fixtures=await fetch('fixtures/cases.json').then(r=>r.json());
for(const c of fixtures)$('case').add(new Option(c.id+' / '+c.label,c.id));$('case').value=q.get('case')||fixtures[0].id;
const app=$('app');app.src='fixtures/'+(before?'before':'after')+'.html';await new Promise(resolve=>{const poll=()=>app.contentWindow.J?.ui?.plan?resolve():setTimeout(poll,30);poll();});
const J=app.contentWindow.J,font=new FontFace('Fixture','url(fixtures/font.otf)');await font.load();document.fonts.add(font);await document.fonts.ready;await document.fonts.load('16px Fixture');window.fontReady=font.status==='loaded';
const size=aspect=>({'16:9':[1920,1080],'9:16':[1080,1920],'1:1':[1440,1440],'21:9':[2520,1080],'4:5':[1440,1800],videoSize:[1777,913]})[aspect];
function input(c){$('time').value=c.time;$('duration').value=c.duration;$('aspect').value=c.aspect;}
input(fixtures.find(c=>c.id===$('case').value));for(const id of ['time','duration','aspect'])if(q.has(id))$(id).value=q.get(id);
window.render=()=>{const c=fixtures.find(c=>c.id===$('case').value),t=+$('time').value,duration=+$('duration').value,[W,H]=size($('aspect').value),p=J.defaultProject();p.seed=1;p.lyrics='[00:00]夜明けの色を覚えてる';p.durationOverride=duration;p.aspect=$('aspect').value;p.lyricEffects={autoPlacement:true,avoidCenter:true,...c.settings};if(c.missing)delete p.lyricAvoidance;else p.lyricAvoidance=JSON.parse(JSON.stringify(c.model));
const beforeJSON=JSON.stringify(p),present=typeof J.resolveAvoidanceAt==='function',cv=$('current');cv.width=W;cv.height=H;const g=cv.getContext('2d');g.fillStyle='#101820';g.fillRect(0,0,W,H);g.strokeStyle='#314454';g.lineWidth=2;g.strokeRect(1,1,W-2,H-2);g.beginPath();g.moveTo(W/2,0);g.lineTo(W/2,H);g.moveTo(0,H/2);g.lineTo(W,H/2);g.stroke();let resolved=null,rejection=null,normalized=null,index=null;
if(present){try{normalized=J.projectLyricAvoidance(p);index=J.buildLyricAvoidanceIndex(p);resolved=J.resolveAvoidanceAt({duration,lyricAvoidanceIndex:index},t);}catch(e){rejection=e.message;}}
const unchanged=beforeJSON===JSON.stringify(p);if(resolved){const r=J.avoidanceCirclePixels(resolved,W,H);g.strokeStyle='#67e8bd';g.fillStyle='#67e8bd22';g.lineWidth=Math.max(3,Math.min(W,H)/250);g.beginPath();g.arc(r.cx,r.cy,r.r,0,Math.PI*2);g.fill();g.stroke();g.fillStyle='#67e8bd';g.beginPath();g.arc(r.cx,r.cy,Math.max(5,r.r/30),0,Math.PI*2);g.fill();}
$('label').textContent=(before?'変更前 固定c930c09':'変更後 実装候補')+' / '+c.id+' / '+$('aspect').value+' / t='+t;
$('status').textContent=!present?'観測: 旧版にresolverが存在しません。結果を捏造せず、領域図は空のまま表示。':rejection?'拒否: '+rejection+' / 元入力保持='+unchanged:resolved?'実resolver: '+resolved.id+' が有効。区間内は固定位置。':'実resolver: null（回避なし）。';
$('metrics').textContent='seed=1 / '+W+'×'+H+' / duration='+duration+'s / bundled Noto CJK / input unchanged='+unchanged+(resolved?' / cx='+resolved.cx+', cy='+resolved.cy+', R='+resolved.r+'×min(W,H)='+resolved.r*Math.min(W,H)+'px':'');
const times=[t,...c.probes].filter((v,i,a)=>a.indexOf(v)===i);$('rows').replaceChildren();const rows=[];for(const time of times){let value='観測: 関数なし';if(present){try{value=JSON.stringify(J.resolveAvoidanceAt({duration,lyricAvoidanceIndex:index??J.buildLyricAvoidanceIndex(p)},time));}catch(e){value='拒否: '+e.message;}}const tr=document.createElement('tr');for(const text of [String(time),value]){const td=document.createElement('td');td.textContent=text;tr.append(td);}$('rows').append(tr);rows.push({time,value});}
window.observation={present,resolved,rejection,inputUnchanged:unchanged,normalized,stage:[W,H],time:t,duration,seed:1,fontLoaded:font.status,rows};$('json').textContent=JSON.stringify({observation:window.observation,input:p.lyricAvoidance},null,2);window.ready=true;};
$('case').onchange=()=>{input(fixtures.find(c=>c.id===$('case').value));window.render();};for(const id of ['time','duration','aspect'])$(id).onchange=window.render;$('run').onclick=window.render;window.render();
})().catch(e=>{window.failure=String(e);document.body.append(String(e));});
</script></html>
