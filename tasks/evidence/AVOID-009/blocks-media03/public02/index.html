<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>積み木：元の動きを60fpsで比較</title><style>*{box-sizing:border-box}body{margin:0;background:#10141d;color:#e8edf7;font:16px/1.6 system-ui,sans-serif}main{max-width:2000px;margin:auto;padding:24px}h1{font-size:clamp(23px,3vw,34px);line-height:1.25;margin:0 0 16px}h2{font-size:20px;margin:0 0 8px}p{max-width:1050px}a{color:#92d8fa}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0}button{border:1px solid #71829d;border-radius:6px;padding:9px 14px;background:#26364e;color:#fff;font:inherit;cursor:pointer}button:hover{background:#344966}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}section{min-width:0}.stage{position:relative;aspect-ratio:16/9;width:100%;background:#151923}video{display:block;width:100%;height:100%;aspect-ratio:16/9;object-fit:contain}.guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}body.guides .guide{display:block}.note{font-size:14px;color:#bdc9db}#status{min-height:1.6em;font-size:14px;color:#ffd384}@media(max-width:800px){main{padding:16px}.comparison{grid-template-columns:1fr;gap:24px}}</style></head><body><main><h1>積み木：元の動きを60fpsで比較</h1><p>元描画の回避OFFと、全体を平行移動する修正後を比較します。積み木の形・文字サイズ・元の動きを保持しています。</p><p>両動画：960×540、60fps、元描画240フレーム、4秒、残像ON。円は別表示のガイドで、動画には焼き込んでいません。</p><p>入口・退場は円を通る場合があります。受入済みの静止保持区間は円を避けます。人間による動作確認は未承認です。</p><p><a href="en.html" lang="en">English</a> · <a href="manifest.json">Manifest</a></p><div class="controls"><button type="button" id="play">両方を先頭から再生</button><button type="button" id="pause">両方を一時停止</button><label><input type="checkbox" id="show-guide"> 円ガイドを表示</label></div><p id="status" role="status" aria-live="polite"></p><div class="comparison"><section aria-labelledby="before-title"><h2 id="before-title">修正前 · 回避OFF</h2><div class="stage"><video id="before" controls loop muted playsinline preload="metadata" width="960" height="540"><source src="before.mp4" type="video/mp4">このブラウザーはMP4動画に対応していません。</video><svg class="guide" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><circle cx="480" cy="226.8" r="108" fill="none" stroke="#ff7195" stroke-width="2" stroke-dasharray="8 6"/></svg></div></section><section aria-labelledby="after-title"><h2 id="after-title">修正後 · 全体を平行移動</h2><div class="stage"><video id="after" controls loop muted playsinline preload="metadata" width="960" height="540"><source src="after.mp4" type="video/mp4">このブラウザーはMP4動画に対応していません。</video><svg class="guide" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><circle cx="480" cy="226.8" r="108" fill="none" stroke="#ff7195" stroke-width="2" stroke-dasharray="8 6"/></svg></div></section></div><p class="note">表示幅に応じて縮小します。元動画はそれぞれ960×540です。</p></main><script>const videos=[document.getElementById('before'),document.getElementById('after')];document.getElementById('play').addEventListener('click',()=>{document.getElementById('status').textContent='';for(const video of videos){video.pause();video.currentTime=0;}Promise.all(videos.map(video=>video.play())).catch(()=>{for(const video of videos)video.pause();document.getElementById('status').textContent="再生を開始できませんでした。各動画の再生ボタンを使用してください。";});});document.getElementById('pause').addEventListener('click',()=>videos.forEach(video=>video.pause()));document.getElementById('show-guide').addEventListener('change',event=>document.body.classList.toggle('guides',event.target.checked));</script></body></html>
