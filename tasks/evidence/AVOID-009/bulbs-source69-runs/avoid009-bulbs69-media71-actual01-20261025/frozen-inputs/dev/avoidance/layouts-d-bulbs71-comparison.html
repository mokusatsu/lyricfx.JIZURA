<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>電球の配置比較</title>
<style>*{box-sizing:border-box}body{margin:auto;max-width:1180px;padding:28px 18px;background:#111722;color:#f3f4f7;font-family:system-ui,sans-serif}h1{font-size:25px}h2{font-size:19px;margin-top:32px}p{color:#b9c3d2;line-height:1.6}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.frame{position:relative;aspect-ratio:16/9}video{display:block;width:100%;height:100%;background:#151923}.circle{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.circle circle{fill:#ff77850b;stroke:#ff9baf;stroke-width:2;stroke-dasharray:7 6}button{margin:12px 0;padding:9px 18px;background:#e8efff;color:#12223b;border:0;border-radius:7px;cursor:pointer}label{display:block;margin-bottom:7px}@media(max-width:720px){.pair{grid-template-columns:1fr}}</style>
<h1>電球の配置比較</h1><p>円を避ける前後を、同じ動きと速度で比較できます。円の目印は動画には含まれていません。</p>
<section data-example="upper"><h2>上寄りの円：横1行を下へ</h2><button>前後を一緒に再生</button><div class="pair"></div></section>
<section data-example="right"><h2>右寄りの円：左側で2行</h2><button>前後を一緒に再生</button><div class="pair"></div></section>
<script>for(const section of document.querySelectorAll('section')){const id=section.dataset.example,normalized=id==='upper'?[.5,.2]:[.75,.42],center=[normalized[0]*960,normalized[1]*540];for(const side of['before','after']){const box=document.createElement('div');box.innerHTML=`<label>${side==='before'?'元の演出':'回避後'}</label><div class="frame"><video controls muted playsinline preload="metadata" poster="posters/${id}-${side}.png" src="videos/${id}-${side}.mp4"></video><svg class="circle" viewBox="0 0 960 540" aria-hidden="true"><circle cx="${center[0]}" cy="${center[1]}" r="108"/></svg></div>`;section.querySelector('.pair').append(box)}section.querySelector('button').onclick=()=>{for(const v of section.querySelectorAll('video')){v.currentTime=0;v.play()}}}</script></html>
