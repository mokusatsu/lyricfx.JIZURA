<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文字の山・退場の動作比較</title><style>body{margin:24px;background:#151923;color:#e6edf7;font:16px/1.7 system-ui}main{max-width:1440px;margin:auto}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}.stage{position:relative}video{display:block;width:100%}.circle{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}.guide .circle{display:block}button,label{margin:1rem 1rem 1rem 0}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style><main><nav><a href="en.html">English</a></nav><h1>文字の山・退場の動作比較</h1><p>同じ「風の先へ」の4秒を比較します。右は形と配置、画面外からの入口を保ち、退場時に山と文字が下がる変位を元の動きへ戻した版です。終わりの動く速さと残像の間隔をご確認ください。</p><button id="play">同時に再生 / 一時停止</button><button id="reset">先頭へ</button><label><input type="checkbox" id="guide">円の位置を表示</label><div class="pair"><section><h2>元の動き</h2><div class="stage"><video playsinline controls preload="metadata" src="videos/pile-before.mp4"></video><svg class="circle" viewBox="0 0 1280 720"><circle cx="640" cy="302.4" r="144" fill="none" stroke="#ff6387" stroke-width="2" stroke-dasharray="8 6"/></svg></div></section><section><h2>退場の動きを修正した配置</h2><div class="stage"><video playsinline controls preload="metadata" src="videos/pile-after.mp4"></video><svg class="circle" viewBox="0 0 1280 720"><circle cx="640" cy="302.4" r="144" fill="none" stroke="#ff6387" stroke-width="2" stroke-dasharray="8 6"/></svg></div></section></div></main><script>const v=[...document.querySelectorAll('video')];let syncing=false;document.getElementById('guide').onchange=e=>document.body.classList.toggle('guide',e.target.checked);document.getElementById('play').onclick=()=>{if(v.every(x=>x.paused)){v.forEach(x=>x.currentTime=v[0].currentTime);v.forEach(x=>x.play())}else v.forEach(x=>x.pause())};document.getElementById('reset').onclick=()=>v.forEach(x=>{x.pause();x.currentTime=0});v.forEach((x,i)=>{x.onseeking=()=>{if(syncing)return;syncing=true;const other=v[1-i];if(Math.abs(other.currentTime-x.currentTime)>.03)other.currentTime=x.currentTime;queueMicrotask(()=>syncing=false)};x.onended=()=>v.forEach(y=>y.pause())});</script></html>
