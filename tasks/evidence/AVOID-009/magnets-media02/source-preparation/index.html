<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マグネット — 動作比較</title><style>body{margin:24px;background:#151923;color:#e6edf7;font:16px/1.6 sans-serif}main{max-width:1960px;margin:auto}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}.stage{position:relative}video{display:block;width:100%;height:auto;background:#151923}.guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}.show-guide .guide{display:block}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px}button,input{font:inherit}label{display:inline-flex;align-items:center;gap:6px}a{color:#7ee9ea}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style><main><h1>マグネット — 動作比較</h1><p>同じ原寸960×540・60fps・4.15秒。元のカットは4秒のまま、最後の残像まで含みます。</p><p>入口の一部で背景の取っ手・飾り文字との重なりが残る候補です。文字の読め方、入口、左右のまとまり、最後の残像をご確認ください。</p><div class="controls"><button id="play">両方再生</button><button id="pause">一時停止</button><button id="reset">先頭に戻す</button><label>時刻 <input id="seek" type="range" min="0" max="4.133333333333333" step="0.016666666666666666" value="0"><output id="time">0.00 s</output></label><label><input id="guide" type="checkbox">円ガイドを重ねる（動画には含まれません）</label></div><div class="pair"><section><h2>元の描画</h2><div class="stage"><video playsinline preload="metadata" width="960" height="540" src="videos/before.mp4"></video><svg class="guide" viewBox="0 0 960 540" aria-hidden="true"><circle cx="480" cy="226.8" r="108" fill="none" stroke="#ff6387" stroke-width="1.5" stroke-dasharray="7 6"/></svg></div></section><section><h2>回避候補</h2><div class="stage"><video playsinline preload="metadata" width="960" height="540" src="videos/after.mp4"></video><svg class="guide" viewBox="0 0 960 540" aria-hidden="true"><circle cx="480" cy="226.8" r="108" fill="none" stroke="#ff6387" stroke-width="1.5" stroke-dasharray="7 6"/></svg></div></section></div><p><a href="en.html">English</a> · <a href="manifest.json">Manifest</a></p></main><script>
const videos=[...document.querySelectorAll('video')],seek=document.getElementById('seek'),time=document.getElementById('time');
function show(t){seek.value=String(t);time.textContent=t.toFixed(2)+' s';}
function pause(){videos.forEach(v=>v.pause());}
function setTime(t){videos.forEach(v=>v.currentTime=t);show(t);}
document.getElementById('play').onclick=async()=>{pause();setTime(videos[0].currentTime);const results=await Promise.allSettled(videos.map(v=>v.play()));if(results.some(r=>r.status==='rejected'))pause();};
document.getElementById('pause').onclick=pause;
document.getElementById('reset').onclick=()=>{pause();setTime(0);};
seek.oninput=()=>{pause();setTime(Number(seek.value));};
videos[0].ontimeupdate=()=>{show(videos[0].currentTime);if(!videos[0].paused&&Math.abs(videos[1].currentTime-videos[0].currentTime)>1/30)videos[1].currentTime=videos[0].currentTime;};
videos.forEach(v=>v.onended=pause);
document.getElementById('guide').onchange=e=>document.body.classList.toggle('show-guide',e.target.checked);
</script></html>
