appId: ws.okamoto.jizura
productName: lyricfx.JIZURA
executableName: lyricfx-jizura
directories:
  output: dist
  buildResources: build
files:
  - "main.cjs"
  - "preload.cjs"
  - "native-jobs.cjs"
  - "web/**/*"
extraResources:
  - from: "resources/native"
    to: "native"
    filter:
      - "**/*"
  - from: "resources/app-build.json"
    to: "app-build.json"
  - from: "resources/licenses"
    to: "licenses"
    filter:
      - "**/*"
win:
  signAndEditExecutable: false
  target:
    - target: dir
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
