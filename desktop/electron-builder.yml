appId: ws.okamoto.jizura
productName: lyricfx.JIZURA
directories:
  output: dist
  buildResources: build
files:
  - "main.cjs"
  - "preload.cjs"
  - "native-jobs.cjs"
  - "web/**/*"
extraResources:
  - from: "resources/native"
    to: "native"
    filter:
      - "**/*"
  - from: "../native/models"
    to: "native/models"
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
