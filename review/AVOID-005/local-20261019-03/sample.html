<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AVOID-005 同条件の操作確認</title>
<style>@font-face{font-family:Fixture;src:url(fixtures/font.otf)}body{font:16px Fixture,sans-serif;background:#17202b;color:#eee;margin:16px}a{color:#acf}nav{display:flex;flex-wrap:wrap;gap:10px}nav>label{min-width:0;max-width:100%;display:flex;flex-wrap:wrap}button,select,input{font:inherit;max-width:100%}#capture{width:1000px;max-width:100%;box-sizing:border-box;padding:16px;background:#17202b}.stages{display:grid;grid-template-columns:1fr 1fr;gap:12px}.single{grid-template-columns:1fr}.stage{position:relative}canvas{width:100%;height:auto;display:block}.guide{position:absolute;border:2px dashed #67e8bd;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-sizing:border-box}iframe{position:absolute;left:-20000px;width:1500px;height:1100px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#label{overflow-wrap:anywhere}#status{min-height:7em;font-weight:bold}@media(max-width:650px){.stages{grid-template-columns:1fr}}</style>
<h1>AVOID-005 同条件の操作確認</h1><p>確認専用の新しいプライベートセッションで開いてください。保存済みプロジェクトへ投入しません。変更前は005の834fb5b、変更後はStack修正候補です。両方で同じ005回避APIを実行します。斜めでも反復行が同じ順序と一定の間隔で積み重なることを確認してください。背景の反復補助のマスクは018の対象です。比較では両方とも同じ固定フォントを使い、通常アプリへの切替は後の段階です。</p>
<nav><a href="index.html">比較へ戻る</a><label>ケース <select id="case"></select></label><label>同じ時刻 <input id="time" type="range" min=".01" max="3.99" step=".01"></label><button id="run">描画／シーク</button><button id="play">再生／停止</button></nav>
<div id="capture"><h2 id="label"></h2><p id="look"></p><p id="change"></p><p id="preserve"></p><div id="stages" class="stages"></div><p id="status" role="status"></p><p id="clock"></p></div><details><summary>技術的な測定・診断</summary><pre id="json"></pre></details>
<script>
(async()=>{const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),cases=await fetch('fixtures/cases.json').then(r=>{if(!r.ok)throw Error('ケース取得失敗');return r.json();}),sides=q.has('side')?[q.get('side')]:['before','after'];if(sides.some(s=>!['before','after'].includes(s)))throw Error('不正な比較側');
const font=new FontFace('Fixture','url(fixtures/font.otf)');await font.load();document.fonts.add(font);await document.fonts.ready;
for(const c of cases)$('case').add(new Option(c.label,c.id));$('case').value=q.get('case')||cases[0].id;if(!$('case').value)throw Error('ケースなし');
function storageState(){return JSON.stringify([localStorage,sessionStorage].map(store=>Object.keys(store).sort().map(k=>[k,store.getItem(k)])));}const initialStorage=storageState();window.fixtureStorageUnchanged=()=>storageState()===initialStorage;
const apps={};window.fixtureFontsSettled=()=>Object.values(apps).every(a=>{const win=a.iframe.contentWindow,doc=a.iframe.contentDocument;return !win.J.ui&&doc.fonts.status==='loaded'&&[...doc.fonts].every(f=>f.status!=='loading')&&(!a.result?.plan.placementFinalization||a.result.plan.placementFinalization.revision===win.J.metrics.revision);});
for(const side of sides){const iframe=document.createElement('iframe');iframe.title=side==='before'?'変更前の描画エンジン':'変更後の描画エンジン';const loaded=new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('描画エンジンの読込待ちが時間切れ')),30000);iframe.onload=()=>{clearTimeout(timer);resolve();};});iframe.src='fixtures/'+side+'-engine.html';document.body.append(iframe);await loaded;const win=iframe.contentWindow,doc=iframe.contentDocument;if(!win.J?.Renderer||!win.J?.plan||!win.J?.LAYOUTS||win.J.ui||doc.getElementById('app')||!doc.getElementById('avoid005-fixture-app'))throw Error('確認専用の描画エンジンではありません');await doc.fonts.ready;if(doc.querySelector('link[href*="fonts.googleapis.com"],link[href*="fonts.gstatic.com"]'))throw Error('外部フォントの読み込みが残っています');const script=doc.createElement('script');script.textContent=await fetch('fixtures/basic-fixture.js').then(r=>r.text());doc.body.append(script);apps[side]={iframe};}
function isolation(side){const a=apps[side],doc=a.iframe.contentDocument;return {mode:'engine-only-dom-v1',editorBoot:!!a.iframe.contentWindow.J.ui,fontStatus:doc.fonts.status,loadingFaces:[...doc.fonts].filter(f=>f.status==='loading').length,externalFontStylesheets:doc.querySelectorAll('link[rel="stylesheet"][href*="fonts.googleapis.com"]').length,storageUnchanged:window.fixtureStorageUnchanged()};}
let sequence=0,queue=Promise.resolve(),playing=false,last=0;function select(){playing=false;const c=cases.find(c=>c.id===$('case').value);$('time').value=c.time;}select();
function copy(a){a.display.getContext('2d').clearRect(0,0,a.display.width,a.display.height);a.display.getContext('2d').drawImage(a.result.canvas,0,0);}
function expose(t){if(!window.fixtureStorageUnchanged())throw Error('確認用の描画が保存領域を書き換えました');if(!window.fixtureFontsSettled())throw Error('確認用フォントの読み込みが完了していません');window.observations=Object.fromEntries(sides.map(s=>[s,apps[s].result.observation]));window.originals=Object.fromEntries(sides.map(s=>[s,apps[s].result.canvas.toDataURL()]));window.observation=window.observations[sides[0]];window.original=window.originals[sides[0]];$('clock').textContent='共通のプロジェクト時刻: '+t.toFixed(2)+' 秒';$('json').textContent=JSON.stringify(window.observations,null,2);window.capturePixels=()=>Object.fromEntries(sides.map(s=>[s,{source:apps[s].result.canvas.toDataURL(),display:apps[s].display.toDataURL()}]));}
window.render=()=>{playing=false;window.ready=false;window.failure=undefined;const token=++sequence,c={...cases.find(c=>c.id===$('case').value),time:+$('time').value};const execute=async()=>{if(token!==sequence)return;$('label').textContent=c.label+(c.expectation==='safe-or-explicit-insufficient'?'【探索条件：安全または制約不足を確認】':c.safeAnchor?'【必須安全例】':'');$('look').textContent='見る箇所：'+c.look;$('change').textContent='変化する箇所：'+c.change;$('preserve').textContent='維持する箇所：'+c.preserve;if(c.availability!=='implemented')throw Error('この対照fixtureは未実装です。前後一致は未確認です。');const results={};for(const side of sides){const win=apps[side].iframe.contentWindow,J=win.J,originalDraw=J.drawItem,actualTexts=[];J.drawItem=function(env,item){const result=originalDraw.apply(this,arguments);if(!env.placementRecorder&&!env.placementEnvelope&&env.pass==='main'&&(item.alpha??1)>0&&env.ctx.globalAlpha>0)actualTexts.push(String(item.text??''));return result;};try{results[side]=await win.runBasicFixture(J,c,{newPath:!['legacy','fullstage'].includes(c.control),fontURL:new URL('fixtures/font.otf',location.href).href});results[side].observation.actualTextDraws=[...new Set(actualTexts)].sort();results[side].observation.fixtureIsolation=isolation(side);}finally{J.drawItem=originalDraw;}}if(token!==sequence)return;$('stages').replaceChildren();$('stages').className='stages'+(sides.length===1?' single':'');for(const side of sides){const a=apps[side];a.result=results[side];const box=document.createElement('div'),caption=document.createElement('p');caption.textContent=side==='before'?'変更前（005修正前834fb5b）':'変更後（Stack修正候補）';const stage=document.createElement('div');stage.className='stage';a.display=document.createElement('canvas');a.display.width=a.result.canvas.width;a.display.height=a.result.canvas.height;stage.append(a.display);copy(a);if(c.control!=='off'){const guide=document.createElement('div');guide.className='guide';const r=c.radius*Math.min(c.W,c.H);Object.assign(guide.style,{left:c.cx*100+'%',top:c.cy*100+'%',width:2*r/c.W*100+'%',height:2*r/c.H*100+'%'});stage.append(guide);}box.append(caption,stage);$('stages').append(box);}const o=results.after?.observation||results.before.observation,raw=o.safety,s=o.diagnostics.some(d=>d.safety==='unsupported')?'unsupported':['safe','certified-bounded-adapter','certified-continuous-route'].includes(raw)?'safe':['insufficient','insufficient-space'].includes(raw)?'insufficient':raw;$('status').textContent=s==='safe'?'このケースの幾何証明：安全（可読性の最終判断とは別です）':s==='insufficient'?'制約不足：この経路候補群では文字サイズと円外収容を満たせません。あらゆる配置が幾何的に不可能という意味ではありません。':s==='unsupported'?'未対応：この描画条件はまだ保証できません。': '旧描画／例外の対照：新しい回避の成功例ではありません。';expose(c.time);window.ready=true;};queue=queue.then(execute,execute);return queue;};
function fail(e){playing=false;window.failure=String(e);$('status').textContent=String(e);}
$('case').onchange=()=>{select();render().catch(fail);};$('run').onclick=()=>render().catch(fail);$('time').oninput=()=>render().catch(fail);$('play').onclick=()=>{if(!window.ready)return;playing=!playing;last=performance.now();if(playing)requestAnimationFrame(tick);};function tick(now){if(!playing)return;const t=(+$('time').value+(now-last)/1000)%4;last=now;$('time').value=t;try{for(const s of sides){const a=apps[s],observations=[];a.result.renderer.frame(a.result.canvas.getContext('2d'),a.result.plan,t,{noHud:true,noPost:true,placementObservation:o=>observations.push(o)});a.result.observation={...a.result.observation,time:t,lastOffsets:observations.map(o=>({offset:o.offset,safety:o.safety}))};copy(a);}expose(t);}catch(e){fail(e);}if(playing)requestAnimationFrame(tick);}await render();
})().catch(e=>{window.failure=String(e);document.getElementById('status').textContent=String(e);});
</script></html>
